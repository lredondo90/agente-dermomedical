name: Agente (seguimientos)

# Llama cada hora, en horario laboral, al endpoint de seguimientos del agente.
# Se activa al definir la variable AGENT_URL (p. ej. https://agente-dermomedical....azurecontainerapps.io)
# y el secreto AGENT_CRON_SECRET en Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: "5 7-18 * * 1-5" # UTC: de 9 a 20 h en Madrid (aprox., según horario de verano)
  workflow_dispatch:

jobs:
  tick:
    if: ${{ vars.AGENT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar seguimientos
        env:
          AGENT_URL: ${{ vars.AGENT_URL }}
          AGENT_CRON_SECRET: ${{ secrets.AGENT_CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 120 -X POST -H "Authorization: Bearer $AGENT_CRON_SECRET" "$AGENT_URL/api/agente/tick"
